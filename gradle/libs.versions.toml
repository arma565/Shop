[versions]
## Dependencies version
coilCompose = "2.7.0"
coreKtx = "1.13.1"
appcompat = "1.7.0"
material = "1.12.0"
androidxNavigation = "2.8.3"
joda = "2.13.0"
core = "1.6.1"
junit = "4.13.2"
room = "2.6.1"
coroutine = "1.9.0"
retrofit = "2.11.0"
workManager="2.9.1"
espressoCore = "3.6.1"
lifecycleRuntimeKtx = "2.8.6"
extTest = "1.2.1"
composeConstraintLayout = "1.0.1"
mockito = "5.14.0"
mockito-androidTestImplementation = "5.14.0"

## Plugins versions
agp = "8.5.2"
kotlin = "2.0.20"
navigation = "2.8.3"
hilt = "2.52"
ksp = "2.0.20-1.0.25"
composeBom = "2024.10.00"


[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
android-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
joda-time = { group = "net.danlew", name = "android.joda", version.ref = "joda" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "core" }
androidx-junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-ext = { group = "androidx.test.ext", name = "junit", version.ref = "extTest" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-android = { group = "org.mockito", name = "mockito-android", version.ref = "mockito-androidTestImplementation" }

## Room
room = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler-ksp = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

## Dagger
dagger-hilt = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
dagger-hilt-compiler-ksp = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

## Coroutine
coroutine-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutine" }
coroutine-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutine" }
coroutine-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutine" }

## Retrofit
retrofit2 = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit2-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }

##WorkManager
work-manager = {group="androidx.work" , name ="work-runtime-ktx" , version.ref = "workManager"}

##Compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coilCompose" }
androidx-ui-compose = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-compose-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-compose-tooling-debug = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-compose-tooling-preview  = { group = "androidx.compose.ui", name = "ui-tooling-preview"}
androidx-ui-compose-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-compose-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version = "1.7.4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3"}
androidx-compose-constraint-layout = { group = "androidx.constraintlayout", name = "constraintlayout-compose" , version.ref = "composeConstraintLayout"}
androidx-compose-activity = { group = "androidx.activity", name = "activity-compose", version = "1.9.3" }
androidx-compose-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose"}
androidx-compose-livedata = { group = "androidx.compose.runtime", name = "runtime-livedata" , version="1.7.4"}
androidx-compose-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose" , version= "2.8.6" }
androidx-compose-icons-core = { group = "androidx.compose.material", name = "material-icons-core"}
androidx-compose-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended"}
androidx-compose-window-size = { group = "androidx.compose.material3", name = "material3-window-size-class"}
androidx-compose-navigation = { group = "androidx.navigation", name = "navigation-compose" ,version.ref="androidxNavigation"}
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation"}


[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
jetbrainsKotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
navigation-safeargs = { id = "androidx.navigation.safeargs", version.ref = "navigation" }
hilt-dagger = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
parcelize = {id = 'kotlin-parcelize'}
